name: Generate contribution snake

on:
  schedule:
    - cron: "41 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#8C3A4B&color_dots=#D6C0A3,#C4A484,#9C7B62,#6F4E37,#3E2723
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E0C49A&color_dots=#2A1A14,#5C3A2A,#8C5E3C,#C4A484,#E0C49A

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
