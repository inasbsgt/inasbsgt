<svg xmlns="http://www.w3.org/2000/svg" width="800" height="40" viewBox="0 0 800 40" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .dash{animation:move 1.6s linear infinite}
    .h{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes move{to{stroke-dashoffset:-28}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
  </style>
  <line class="dash" x1="20" y1="20" x2="360" y2="20" stroke="#D2B48C" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <line class="dash" x1="440" y1="20" x2="780" y2="20" stroke="#D2B48C" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 12"/>
  <g transform="translate(400,20)"><path class="h" d="M0,-4 C-2,-10 -12,-9 -12,-1 C-12,6 -4,9 0,14 C4,9 12,6 12,-1 C12,-9 2,-10 0,-4Z" fill="#A9746E"/></g>
</svg>
