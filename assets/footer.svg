<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4C2C2"/><stop offset="1" stop-color="#D2B48C"/></linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#A9746E"/><stop offset="1" stop-color="#8B5E3C"/></linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6F4E37"/><stop offset="1" stop-color="#4E342E"/></linearGradient>
  </defs>
  <style>
    .wa{animation:slide 9s linear infinite}
    .wb{animation:slide 6s linear infinite}
    .wc{animation:slide 4s linear infinite}
    .h{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes slide{from{transform:translateX(0)}to{transform:translateX(-900px)}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
    .thx{font:700 26px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#6F4E37}
    .sm{font:600 16px 'Courier New',Courier,monospace;fill:#A9746E}
  </style>
  <rect width="900" height="200" rx="30" fill="#FFF8F0"/>
  <text x="450" y="52" text-anchor="middle" class="thx">Thanks for visiting</text>
  <g transform="translate(608,42)"><path class="h" d="M0,-4 C-2,-10 -12,-9 -12,-1 C-12,6 -4,9 0,14 C4,9 12,6 12,-1 C12,-9 2,-10 0,-4Z" fill="#F4A6B8"/></g>
  <text x="450" y="82" text-anchor="middle" class="sm">see you at the next commit ☕</text>

  <path class="wa" fill="url(#w1)" opacity=".9" d="M0,110 C150,70 300,150 450,110 C600,70 750,150 900,110 C1050,70 1200,150 1350,110 C1500,70 1650,150 1800,110 V200 H0Z"/>
  <path class="wb" fill="url(#w2)" opacity=".9" d="M0,135 C150,95 300,175 450,135 C600,95 750,175 900,135 C1050,95 1200,175 1350,135 C1500,95 1650,175 1800,135 V200 H0Z"/>
  <path class="wc" fill="url(#w3)" d="M0,160 C150,125 300,195 450,160 C600,125 750,195 900,160 C1050,125 1200,195 1350,160 C1500,125 1650,195 1800,160 V200 H0Z"/>
</svg>
