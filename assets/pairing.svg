<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFF8F0"/><stop offset="1" stop-color="#F0DCCB"/></linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8B5E3C"/><stop offset="1" stop-color="#4E342E"/></linearGradient>
    <linearGradient id="sq" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7B5646"/><stop offset="1" stop-color="#3E2723"/></linearGradient>
    <clipPath id="cup"><path d="M-55,-30 H55 V25 C55,58 32,78 0,78 C-32,78 -55,58 -55,25Z"/></clipPath>
  </defs>
  <style>
    .steam{animation:steam 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
    .wave{animation:wave 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
    .h{animation:beat 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .bean{animation:spin 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes steam{0%{opacity:0;transform:translateY(10px) scaleY(.7)}50%{opacity:.9}100%{opacity:0;transform:translateY(-18px) scaleY(1.1)}}
    @keyframes wave{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
    @keyframes spin{0%,100%{transform:rotate(-20deg)}50%{transform:rotate(20deg)}}
    .big{font:700 28px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#6F4E37}
    .small{font:600 17px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#A9746E}
  </style>
  <rect x="3" y="3" width="794" height="294" rx="28" fill="url(#card)" stroke="#D2B48C" stroke-width="3"/>
  <text x="400" y="46" text-anchor="middle" class="big">my perfect pair</text>

