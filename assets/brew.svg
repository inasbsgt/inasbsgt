<svg xmlns="http://www.w3.org/2000/svg" width="700" height="260" viewBox="0 0 700 260" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8B5E3C"/><stop offset="1" stop-color="#4E342E"/>
    </linearGradient>
    <clipPath id="cup"><path d="M-60,-40 H60 V30 C60,66 34,88 0,88 C-34,88 -60,66 -60,30Z"/></clipPath>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F0"/><stop offset="1" stop-color="#F7E6D8"/>
    </linearGradient>
  </defs>
  <style>
    .steam{animation:steam 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
    .dot{animation:dot 1.4s infinite}
    .h{animation:beat 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    @keyframes steam{0%{opacity:0;transform:translateY(10px) scaleY(.7)}50%{opacity:.9}100%{opacity:0;transform:translateY(-18px) scaleY(1.1)}}
    @keyframes dot{0%,20%{opacity:.15}50%{opacity:1}100%{opacity:.15}}
    @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.25)}}
    .big{font:700 30px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#6F4E37}
    .small{font:600 18px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#A9746E}
  </style>
  <rect x="3" y="3" width="694" height="254" rx="28" fill="url(#card)" stroke="#D2B48C" stroke-width="3"/>

  <g transform="translate(160,120)">
    <path class="steam" d="M-22,-62 C-32,-78 -12,-88 -22,-104" stroke="#A9746E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path class="steam" style="animation-delay:.8s" d="M0,-62 C-10,-78 10,-88 0,-104" stroke="#A9746E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path class="steam" style="animation-delay:1.6s" d="M22,-62 C12,-78 32,-88 22,-104" stroke="#A9746E" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M60,-20 C104,-20 104,40 56,40" stroke="#D2B48C" stroke-width="12" fill="none" stroke-linecap="round"/>
    <path d="M-60,-40 H60 V30 C60,66 34,88 0,88 C-34,88 -60,66 -60,30Z" fill="#FFFFFF" stroke="#D2B48C" stroke-width="4"/>
    <g clip-path="url(#cup)">
      <rect x="-70" width="140" height="140" fill="url(#coffee)">
        <animate attributeName="y" dur="6s" repeatCount="indefinite" keyTimes="0;0.7;0.9;1" values="90;-22;-22;90"/>
      </rect>
    </g>
    <path d="M-60,-40 H60 V30 C60,66 34,88 0,88 C-34,88 -60,66 -60,30Z" fill="none" stroke="#D2B48C" stroke-width="4"/>
    <ellipse cx="0" cy="102" rx="82" ry="8" fill="#D2B48C" opacity=".55"/>
    <g transform="translate(-6,28)"><path class="h" d="M0,-4 C-2,-10 -12,-9 -12,-1 C-12,6 -4,9 0,14 C4,9 12,6 12,-1 C12,-9 2,-10 0,-4Z" fill="#F4C2C2"/></g>
  </g>

  <text x="300" y="100" class="small">currently brewing</text>
  <text x="300" y="145" class="big">SQL</text>
  <g>
    <text x="392" y="145" class="big">.</text>
    <text x="408" y="145" class="big dot" style="animation-delay:.25s">.</text>
    <text x="424" y="145" class="big dot" style="animation-delay:.5s">.</text>
  </g>
  <text x="300" y="185" class="small">next on the menu: databases,</text>
  <text x="300" y="210" class="small">networks and a lot of curiosity</text>
</svg>
