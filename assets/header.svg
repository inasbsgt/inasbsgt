<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6F4E37"/>
      <stop offset="0.55" stop-color="#A9746E"/>
      <stop offset="1" stop-color="#F4C2C2"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="320" rx="30"/></clipPath>
    <path id="heart" d="M0,-4 C-2,-10 -12,-9 -12,-1 C-12,6 -4,9 0,14 C4,9 12,6 12,-1 C12,-9 2,-10 0,-4Z"/>
    <path id="star" d="M0,-10 L2.5,-2.5 L10,0 L2.5,2.5 L0,10 L-2.5,2.5 L-10,0 L-2.5,-2.5Z"/>
    <clipPath id="t1"><rect x="0" y="176" height="50"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.08;0.30;0.31;1" values="200;720;720;200;200"/></rect></clipPath>
    <clipPath id="t2"><rect x="0" y="176" height="50"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.33;0.41;0.63;0.64;1" values="200;200;720;720;200;200"/></rect></clipPath>
    <clipPath id="t3"><rect x="0" y="176" height="50"><animate attributeName="width" dur="12s" repeatCount="indefinite" keyTimes="0;0.66;0.74;0.96;0.97;1" values="200;200;720;720;200;200"/></rect></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#3E2723" flood-opacity="0.35"/>
    </filter>

    <g id="bean"><ellipse rx="8" ry="12" fill="#3E2723"/><path d="M-1,-11 C-6,-3 4,3 -1,11" stroke="#1B0F0A" stroke-width="2" fill="none" stroke-linecap="round"/></g>
    <g id="choc"><rect x="-11" y="-11" width="22" height="22" rx="4" fill="#4E342E"/><rect x="-7" y="-7" width="14" height="14" rx="2.5" fill="#6D4C41"/><path d="M-7,-7 L7,-7" stroke="#8D6E63" stroke-width="2" stroke-linecap="round"/></g>
  </defs>
  <style>
    .rise{animation:rise 7s linear infinite;transform-box:fill-box;transform-origin:center}
    .tw{animation:tw 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
    .bob{animation:bob 3.2s ease-in-out infinite}
    .steam{animation:steam 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center bottom}
    @keyframes rise{0%{transform:translateY(0) scale(.5);opacity:0}15%{opacity:.95}100%{transform:translateY(-330px) scale(1.15);opacity:0}}
    @keyframes tw{0%,100%{opacity:.15;transform:scale(.5)}50%{opacity:1;transform:scale(1.25)}}
    @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @keyframes steam{0%{opacity:0;transform:translateY(8px) scaleY(.7)}50%{opacity:.85}100%{opacity:0;transform:translateY(-16px) scaleY(1.1)}}

    .fall{animation:fall 8s linear infinite;transform-box:fill-box;transform-origin:center}
    @keyframes fall{0%{transform:translateY(0) rotate(0deg);opacity:0}10%{opacity:1}90%{opacity:1}100%{transform:translateY(400px) rotate(300deg);opacity:0}}
    .title{font:700 66px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFF8F0}
    .sub{font:600 26px 'Courier New',Courier,monospace;fill:#FFF8F0}
    .tag{font:600 16px 'Trebuchet MS','Segoe UI',Verdana,sans-serif;fill:#FFF8F0;opacity:.9}
  </style>

  <g clip-path="url(#round)">
    <rect width="900" height="320" fill="url(#bg)"/>
    <circle cx="90" cy="60" r="120" fill="#FFF8F0" opacity=".07"/>
    <circle cx="820" cy="280" r="150" fill="#FFF8F0" opacity=".08"/>

    <!-- floating hearts -->
    <g transform="translate(70,330)"><g class="rise" fill="#FFD6E0" style="animation-delay:0s"><use href="#heart"/></g></g>
    <g transform="translate(190,330)"><g class="rise" fill="#F4C2C2" style="animation-delay:1.6s"><use href="#heart"/></g></g>
    <g transform="translate(330,330)"><g class="rise" fill="#FFF8F0" style="animation-delay:3.1s"><use href="#heart"/></g></g>
    <g transform="translate(470,330)"><g class="rise" fill="#FFD6E0" style="animation-delay:4.4s"><use href="#heart"/></g></g>
    <g transform="translate(610,330)"><g class="rise" fill="#F4C2C2" style="animation-delay:2.2s"><use href="#heart"/></g></g>
    <g transform="translate(730,330)"><g class="rise" fill="#FFF8F0" style="animation-delay:5.3s"><use href="#heart"/></g></g>
    <g transform="translate(840,330)"><g class="rise" fill="#FFD6E0" style="animation-delay:0.8s"><use href="#heart"/></g></g>

    <!-- sparkles -->
    <g transform="translate(60,70)"><g class="tw" fill="#FFF8F0"><use href="#star"/></g></g>
    <g transform="translate(250,40)"><g class="tw" fill="#FFE9B8" style="animation-delay:.6s"><use href="#star"/></g></g>
    <g transform="translate(560,55)"><g class="tw" fill="#FFF8F0" style="animation-delay:1.2s"><use href="#star"/></g></g>
    <g transform="translate(700,40)"><g class="tw" fill="#FFE9B8" style="animation-delay:.3s"><use href="#star"/></g></g>
    <g transform="translate(840,50)"><g class="tw" fill="#FFF8F0" style="animation-delay:1.8s"><use href="#star"/></g></g>
    <g transform="translate(110,270)"><g class="tw" fill="#FFE9B8" style="animation-delay:.9s"><use href="#star"/></g></g>
    <g transform="translate(790,240)"><g class="tw" fill="#FFF8F0" style="animation-delay:1.5s"><use href="#star"/></g></g>

    <!-- falling coffee beans and chocolate -->
    <g transform="translate(40,-30)"><g class="fall" style="animation-delay:0.0s"><use href="#bean"/></g></g>
    <g transform="translate(150,-30)"><g class="fall" style="animation-delay:1.0s"><use href="#choc"/></g></g>
    <g transform="translate(270,-30)"><g class="fall" style="animation-delay:2.0s"><use href="#bean"/></g></g>
    <g transform="translate(400,-30)"><g class="fall" style="animation-delay:3.0s"><use href="#choc"/></g></g>
    <g transform="translate(520,-30)"><g class="fall" style="animation-delay:4.0s"><use href="#bean"/></g></g>
    <g transform="translate(640,-30)"><g class="fall" style="animation-delay:5.0s"><use href="#choc"/></g></g>
    <g transform="translate(760,-30)"><g class="fall" style="animation-delay:6.0s"><use href="#bean"/></g></g>
    <g transform="translate(860,-30)"><g class="fall" style="animation-delay:7.0s"><use href="#choc"/></g></g>

    <!-- title -->
    <g class="bob" filter="url(#shadow)">
      <text x="450" y="130" text-anchor="middle" class="title">Hi, I am Inas ♡</text>
    </g>

    <!-- typing lines -->
    <g clip-path="url(#t1)"><text x="450" y="212" text-anchor="middle" class="sub">CS Student @ UIR</text></g>
    <g clip-path="url(#t2)"><text x="450" y="212" text-anchor="middle" class="sub">Powered by coffee &amp; curiosity</text></g>
    <g clip-path="url(#t3)"><text x="450" y="212" text-anchor="middle" class="sub">C > Python > Network > SQL</text></g>

    <text x="450" y="272" text-anchor="middle" class="tag">coffee  •  dark chocolate  •  always learning</text>

    <!-- steaming cup -->
    <g transform="translate(790,150)">
      <path class="steam" d="M-12,-18 C-20,-30 -4,-38 -12,-52" stroke="#FFF8F0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:.8s" d="M0,-18 C-8,-30 8,-38 0,-52" stroke="#FFF8F0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path class="steam" style="animation-delay:1.6s" d="M12,-18 C4,-30 20,-38 12,-52" stroke="#FFF8F0" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M-26,-8 H26 V16 C26,32 14,42 0,42 C-14,42 -26,32 -26,16Z" fill="#FFF8F0"/>
      <path d="M26,0 C46,0 46,26 24,26" stroke="#FFF8F0" stroke-width="6" fill="none" stroke-linecap="round"/>
      <ellipse cx="0" cy="-8" rx="26" ry="5" fill="#6F4E37"/>
      <ellipse cx="0" cy="48" rx="34" ry="5" fill="#FFF8F0" opacity=".55"/>
    </g>
  </g>
</svg>
